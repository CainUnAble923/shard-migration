<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:transparent}</style></head><body>

<div style="width: 560px; height: 420px; box-sizing: border-box; padding: 18px 20px; background: #0d0d0d; border: 1px solid #2a2317; border-radius: 3px; font-family: Georgia, 'Times New Roman', serif; color: #cfcabd; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-size: 20.8px; font-weight: 400; letter-spacing: 0.04em; color: #c8a96e">League quartermaster</h1>
<span style="font-family: Consolas, Menlo, monospace; font-size: 14.72px; color: #e3c98d">[BALANCE] Legacy Gems</span>
</div>
<div style="height: 1px; background: #2a2317"></div>
<div style="display: flex; gap: 8px">
<button style="height: 32px; padding: 0 14px; background: #221c10; border: 1px solid #c8a96e; border-radius: 3px; font-family: Georgia, serif; font-size: 14.4px; color: #ffffff">Gear</button>
<button style="height: 32px; padding: 0 14px; background: #16130c; border: 1px solid #2a2317; border-radius: 3px; font-family: Georgia, serif; font-size: 14.4px; color: #e3c98d">Companions</button>
<button style="height: 32px; padding: 0 14px; background: #16130c; border: 1px solid #2a2317; border-radius: 3px; font-family: Georgia, serif; font-size: 14.4px; color: #e3c98d">Decor</button>
<button style="height: 32px; padding: 0 14px; background: #16130c; border: 1px solid #2a2317; border-radius: 3px; font-family: Georgia, serif; font-size: 14.4px; color: #e3c98d">Cosmetic</button>
</div>
<div style="display: flex; flex-direction: column; flex: 1">
<div style="display: grid; grid-template-columns: 1fr 96px 96px 72px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2317">
<span>Lesser bag of holding</span>
<span style="font-family: Consolas, monospace; font-size: 12px; letter-spacing: 0.14em; color: #82c28f">UNCOMMON</span>
<span style="font-family: Consolas, monospace; font-size: 14.72px; color: #e3c98d; text-align: right">[PRICE]</span>
<button style="height: 28px; background: #16130c; border: 1px solid #c8a96e; border-radius: 3px; font-family: Georgia, serif; font-size: 13.6px; color: #e3c98d">Buy</button>
</div>
<div style="display: grid; grid-template-columns: 1fr 96px 96px 72px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2317">
<span>Reagent bag</span>
<span style="font-family: Consolas, monospace; font-size: 12px; letter-spacing: 0.14em; color: #82c28f">UNCOMMON</span>
<span style="font-family: Consolas, monospace; font-size: 14.72px; color: #e3c98d; text-align: right">[PRICE]</span>
<button style="height: 28px; background: #16130c; border: 1px solid #c8a96e; border-radius: 3px; font-family: Georgia, serif; font-size: 13.6px; color: #e3c98d">Buy</button>
</div>
<div style="display: grid; grid-template-columns: 1fr 96px 96px 72px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2317">
<span>Rare bag of holding</span>
<span style="font-family: Consolas, monospace; font-size: 12px; letter-spacing: 0.14em; color: #71a9dc">RARE</span>
<span style="font-family: Consolas, monospace; font-size: 14.72px; color: #e3c98d; text-align: right">[PRICE]</span>
<button style="height: 28px; background: #16130c; border: 1px solid #c8a96e; border-radius: 3px; font-family: Georgia, serif; font-size: 13.6px; color: #e3c98d">Buy</button>
</div>
<div style="display: grid; grid-template-columns: 1fr 96px 96px 72px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #2a2317">
<span>Sword part: [PART NAME]</span>
<span style="font-family: Consolas, monospace; font-size: 12px; letter-spacing: 0.14em; color: #b894dd">EPIC</span>
<span style="font-family: Consolas, monospace; font-size: 14.72px; color: #e3c98d; text-align: right">[PRICE]</span>
<button style="height: 28px; background: #16130c; border: 1px solid #c8a96e; border-radius: 3px; font-family: Georgia, serif; font-size: 13.6px; color: #e3c98d">Buy</button>
</div>
</div>
<p style="margin: 0; font-size: 13.6px; color: #8a8578">Prices refresh each loop · Purchases are bound to this character</p>
</div>
</body></html>
